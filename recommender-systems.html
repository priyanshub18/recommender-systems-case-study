<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>
      Recommender Systems: A Graph Theory Approach (20-Slide Seminar)
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #14213d;
        --ink: #1f2937;
        --muted: #5b6475;
        --dim: #8a92a3;
        --line: #dfe3ea;
        --soft: #f5f7fa;
        --accent: #9b1c2c;
        --accent-soft: #fbeef0;
        --blue: #1d4e89;
        --blue-soft: #eaf1fa;
        --green: #1e7a4f;
        --green-soft: #e9f6ef;
        --gold: #b7791f;
        --gold-soft: #fbf4e6;
        --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
        --sans:
          "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e8ebf0;
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
      }

      /* ---------- chrome ---------- */
      #viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }
      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1280px;
        height: 720px;
        transform-origin: center;
        background: #fff;
        box-shadow: 0 12px 40px rgba(20, 33, 61, 0.16);
        overflow: hidden;
      }
      footer {
        flex: none;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        background: #fff;
        border-top: 1px solid var(--line);
      }
      .btn {
        height: 34px;
        min-width: 36px;
        padding: 0 12px;
        border: 1px solid #cdd3dd;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: var(--navy);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        border-color: var(--navy);
        background: var(--soft);
      }
      .btn.on {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      #prog {
        flex: 1;
        display: flex;
        gap: 3px;
        align-items: center;
      }
      #prog .seg {
        flex: var(--n);
        height: 6px;
        border-radius: 3px;
        background: #e3e7ee;
        overflow: hidden;
        cursor: pointer;
      }
      #prog .seg i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--navy);
        transition: width 0.3s;
      }
      #count {
        font-size: 14px;
        color: var(--muted);
        min-width: 64px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #notes {
        position: fixed;
        left: 20px;
        bottom: 68px;
        width: min(560px, calc(100vw - 40px));
        background: #fff;
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 16px;
        line-height: 1.55;
        color: var(--ink);
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18);
        z-index: 20;
      }
      #notes small {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 4px;
      }
      #menu {
        position: fixed;
        right: 20px;
        bottom: 68px;
        width: min(400px, calc(100vw - 40px));
        max-height: 72vh;
        overflow: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18);
        z-index: 21;
      }
      #menu button {
        display: flex;
        gap: 10px;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14.5px;
      }
      #menu button:hover {
        background: var(--soft);
      }
      #menu button.cur {
        background: var(--blue-soft);
        color: var(--blue);
        font-weight: 600;
      }
      #menu span {
        color: var(--dim);
        min-width: 24px;
        font-variant-numeric: tabular-nums;
      }
      #help {
        position: fixed;
        right: 20px;
        bottom: 68px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 18px;
        font-size: 14px;
        line-height: 2;
        color: var(--muted);
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18);
        z-index: 22;
      }
      kbd {
        font: 500 12px var(--mono);
        border: 1px solid #cdd3dd;
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--ink);
        background: var(--soft);
      }
      /* fullscreen: only the slide */
      body.fs {
        background: #fff;
      }
      body.fs footer,
      body.fs #notes,
      body.fs #menu,
      body.fs #help {
        display: none !important;
      }
      body.fs #stage {
        box-shadow: none;
      }
      @media (max-width: 700px) {
        .btn .t {
          display: none;
        }
      }

      /* ---------- slide layout (flow layout: nothing absolutely overlaps) ---------- */
      .slide {
        position: absolute;
        inset: 0;
        padding: 44px 72px 72px 84px;
        display: flex;
        flex-direction: column;
      }
      .slide::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 12px;
        background: var(--navy);
      }
      .head {
        flex: none;
      }
      .kicker {
        font: 700 13px/1 var(--sans);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .title {
        font: 600 36px/1.15 var(--serif);
        color: var(--navy);
        margin: 10px 0 0;
        letter-spacing: -0.01em;
      }
      .rule {
        height: 2px;
        background: var(--line);
        margin-top: 14px;
        position: relative;
      }
      .rule::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        width: 90px;
        background: var(--accent);
      }
      .body {
        flex: 1;
        min-height: 0;
        margin-top: 22px;
        overflow: hidden;
      }
      .sfoot {
        position: absolute;
        left: 84px;
        right: 72px;
        bottom: 22px;
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--dim);
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }

      .two {
        display: grid;
        grid-template-columns: 530px 1fr;
        gap: 42px;
        height: 100%;
        align-items: center;
      }
      .two-eq {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        height: 100%;
        align-items: start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .row2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .row4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }

      /* reveal */
      .r {
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      .r.on {
        opacity: 1;
        transform: none;
      }
      svg .r {
        transform: none;
      }
      .instant,
      .instant * {
        transition: none !important;
      }

      /* text blocks */
      .lead {
        font-size: 20px;
        line-height: 1.5;
        color: var(--ink);
        margin: 0;
      }
      .small {
        font-size: 15px;
        color: var(--muted);
        line-height: 1.5;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px 20px;
        background: #fff;
      }
      .card.tint {
        background: var(--soft);
      }
      .card h3 {
        font: 600 21px/1.25 var(--serif);
        color: var(--navy);
        margin: 0 0 8px;
      }
      .card p {
        margin: 0;
        font-size: 17px;
        line-height: 1.5;
        color: var(--ink);
      }
      .card .tag {
        display: inline-block;
        font: 700 12px var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .callout {
        border-left: 4px solid var(--accent);
        background: var(--accent-soft);
        padding: 14px 18px;
        border-radius: 0 8px 8px 0;
        font-size: 18px;
        line-height: 1.45;
      }
      .callout.blue {
        border-color: var(--blue);
        background: var(--blue-soft);
      }
      .callout.green {
        border-color: var(--green);
        background: var(--green-soft);
      }
      .callout.gold {
        border-color: var(--gold);
        background: var(--gold-soft);
      }
      .def {
        display: grid;
        grid-template-columns: 115px 1fr;
        gap: 16px;
        padding: 12px 4px;
        border-bottom: 1px solid var(--line);
        align-items: baseline;
      }
      .def b {
        font: 600 20px var(--serif);
        color: var(--navy);
      }
      .def span {
        font-size: 18px;
        line-height: 1.45;
      }
      .def i {
        font-style: normal;
        color: var(--muted);
      }
      .stat {
        text-align: left;
      }
      .stat .num {
        font: 700 44px/1.05 var(--serif);
        color: var(--navy);
      }
      .stat .lab {
        font-size: 17px;
        line-height: 1.4;
        margin-top: 10px;
      }
      .stat .src {
        font-size: 13px;
        color: var(--dim);
        margin-top: 6px;
      }
      .steprow {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 14px;
        align-items: start;
      }
      .steprow .n {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font: 700 16px var(--sans);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .steprow .n.acc {
        background: var(--accent);
      }
      .steprow .n.blu {
        background: var(--blue);
      }
      .steprow div:last-child {
        font-size: 18px;
        line-height: 1.45;
        padding-top: 5px;
      }
      .mono {
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.75;
        color: var(--ink);
      }
      .badge {
        display: inline-block;
        font: 700 13px var(--sans);
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .badge.grey {
        background: var(--soft);
        color: var(--muted);
      }
      .badge.blue {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .badge.green {
        background: var(--green-soft);
        color: var(--green);
      }
      .pt-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .pt-h b {
        font: 600 19px var(--serif);
        color: var(--navy);
      }

      /* table / matrix */
      table.mat {
        border-collapse: collapse;
        width: 100%;
        font-size: 15.5px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      table.mat th,
      table.mat td {
        border: 1px solid var(--line);
        padding: 10px 12px;
        text-align: center;
      }
      table.mat th {
        background: var(--soft);
        color: var(--navy);
        font-weight: 700;
      }
      table.mat td.hi {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
      }
      table.mat td.z {
        color: var(--dim);
      }

      /* bars */
      .brow {
        display: grid;
        grid-template-columns: 135px 1fr 64px;
        gap: 12px;
        align-items: center;
        height: 38px;
      }
      .brow .lab {
        font-size: 16.5px;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }
      .brow .track {
        height: 20px;
        background: var(--soft);
        border-radius: 4px;
        overflow: hidden;
      }
      .brow .bar {
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 4px;
        transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .brow .bar.b2 {
        background: var(--blue);
      }
      .brow .val {
        font: 600 16.5px var(--sans);
        color: var(--navy);
        font-variant-numeric: tabular-nums;
      }

      /* pipeline */
      .pbox {
        border: 1px solid var(--line);
        border-top: 4px solid var(--navy);
        border-radius: 8px;
        padding: 16px 18px;
        background: #fff;
        position: relative;
        height: 100%;
      }
      .pbox .k {
        font: 700 13px var(--sans);
        letter-spacing: 0.12em;
        color: var(--accent);
      }
      .pbox h3 {
        font: 600 21px var(--serif);
        color: var(--navy);
        margin: 6px 0 8px;
      }
      .pbox p {
        margin: 0;
        font-size: 16.5px;
        line-height: 1.45;
      }
      .pbox:not(:last-child)::after {
        content: "→";
        position: absolute;
        right: -15px;
        top: 42%;
        font-size: 20px;
        color: var(--dim);
      }

      /* svg graph */
      svg.g {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      svg.g .edge {
        stroke: #c3cad6;
        stroke-width: 2.5;
        transition:
          stroke 0.4s,
          stroke-width 0.4s,
          opacity 0.45s;
      }
      svg.g .edge.hl {
        stroke: var(--accent);
        stroke-width: 5;
      }
      svg.g .edge.hl2 {
        stroke: var(--blue);
        stroke-width: 5;
      }
      svg.g .edge.dash {
        stroke-dasharray: 6 6;
      }
      svg.g .node {
        transition: opacity 0.45s;
      }
      svg.g .node circle,
      svg.g .node rect {
        transition:
          fill 0.4s,
          stroke 0.4s;
      }
      svg.g .node text {
        font-family: var(--sans);
        font-weight: 600;
        transition: fill 0.4s;
        pointer-events: none;
      }
      svg.g .v circle {
        fill: var(--navy);
      }
      svg.g .v text {
        fill: #fff;
        font-size: 14.5px;
      }
      svg.g .s rect {
        fill: #fff;
        stroke: var(--accent);
        stroke-width: 2;
      }
      svg.g .s text {
        fill: var(--ink);
        font-size: 15px;
      }
      svg.g .a rect {
        fill: var(--gold-soft);
        stroke: var(--gold);
        stroke-width: 2;
        stroke-dasharray: 5 4;
      }
      svg.g .a text {
        fill: #7a4e0e;
        font-size: 14.5px;
      }
      svg.g .p circle {
        fill: #fff;
        stroke: var(--navy);
        stroke-width: 2.5;
      }
      svg.g .p text {
        fill: var(--navy);
        font-size: 17px;
      }
      svg.g .v.hl circle {
        fill: var(--accent);
      }
      svg.g .v.hl2 circle {
        fill: var(--blue);
      }
      svg.g .s.hl rect {
        fill: var(--accent);
      }
      svg.g .s.hl text {
        fill: #fff;
      }
      svg.g .s.hl2 rect {
        fill: var(--blue-soft);
        stroke: var(--blue);
      }
      svg.g .p.hl circle {
        fill: var(--accent);
        stroke: var(--accent);
      }
      svg.g .p.hl text {
        fill: #fff;
      }
      svg.g .a.hl rect {
        fill: var(--gold);
        stroke: var(--gold);
      }
      svg.g .a.hl text {
        fill: #fff;
      }
      svg.g .fade {
        opacity: 0.22;
      }
      svg.g .glab {
        font: 700 12.5px var(--sans);
        letter-spacing: 0.14em;
        fill: var(--dim);
      }
      svg.g .note {
        font: 600 13px var(--sans);
        fill: var(--accent);
      }
      svg.g #tok {
        fill: var(--gold);
        stroke: #fff;
        stroke-width: 3;
      }

      /* cover */
      .cover {
        padding: 0;
      }
      .cover .wrap {
        position: absolute;
        left: 96px;
        top: 0;
        bottom: 0;
        width: 640px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .cover .ck {
        font: 700 14px var(--sans);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .cover h1 {
        font: 600 54px/1.1 var(--serif);
        color: var(--navy);
        margin: 18px 0 0;
        letter-spacing: -0.015em;
      }
      .cover .sub {
        font-size: 22px;
        line-height: 1.45;
        color: var(--muted);
        margin: 20px 0 0;
      }
      .cover .who {
        margin-top: 44px;
        padding-top: 20px;
        border-top: 2px solid var(--line);
        font-size: 18px;
        line-height: 1.6;
      }
      .cover .who b {
        font: 600 21px var(--serif);
        color: var(--navy);
      }
      .cover .art {
        position: absolute;
        right: 56px;
        top: 110px;
        width: 440px;
      }
      .cover .sfoot {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="viewport"><div id="stage"></div></div>

    <footer>
      <button class="btn" id="bPrev" title="Previous (←)">
        <svg viewBox="0 0 24 24">
          <path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z" /></svg
        ><span class="t">Prev</span>
      </button>
      <button class="btn" id="bNext" title="Next (Space / →)">
        <span class="t">Next</span
        ><svg viewBox="0 0 24 24">
          <path d="M10 6 8.6 7.4l4.6 4.6-4.6 4.6L10 18l6-6z" />
        </svg>
      </button>
      <div id="prog"></div>
      <div id="count"></div>
      <button class="btn" id="bMenu" title="Slides (M)">
        <span>Slides</span>
      </button>
      <button class="btn" id="bNotes" title="Speaker notes (N)">
        <span>Notes</span>
      </button>
      <button class="btn" id="bFull" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24">
          <path
            d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
          /></svg
        ><span class="t">Fullscreen</span>
      </button>
      <button class="btn" id="bHelp" title="Shortcuts (?)">?</button>
    </footer>

    <div id="notes" hidden></div>
    <div id="menu" hidden></div>
    <div id="help" hidden>
      <div><kbd>Space</kbd> <kbd>→</kbd> next &nbsp; <kbd>←</kbd> back</div>
      <div><kbd>F</kbd> fullscreen &nbsp; <kbd>Esc</kbd> exit</div>
      <div><kbd>N</kbd> speaker notes &nbsp; <kbd>M</kbd> slide list</div>
      <div><kbd>Home</kbd> first &nbsp; <kbd>End</kbd> last</div>
    </div>

    <script>
      // ============================================================ graph datasets
      // General User-Item Bipartite Graph used throughout the core theory slides
      const GEN_BIP = {
        vb: "0 0 560 400",
        labels: [
          [100, 24, "USERS (U)"],
          [420, 24, "ITEMS (I)"],
        ],
        nodes: [
          { id: "u1", x: 100, y: 78, t: "User U₁", k: "v" },
          { id: "u2", x: 100, y: 168, t: "User U₂", k: "v" },
          { id: "u3", x: 100, y: 258, t: "User U₃", k: "v" },
          { id: "u4", x: 100, y: 348, t: "User U₄", k: "v" },
          { id: "i1", x: 420, y: 60, t: "Item I₁", k: "s" },
          { id: "i2", x: 420, y: 132, t: "Item I₂", k: "s" },
          { id: "i3", x: 420, y: 204, t: "Item I₃", k: "s" },
          { id: "i4", x: 420, y: 276, t: "Item I₄", k: "s" },
          { id: "i5", x: 420, y: 348, t: "Item I₅", k: "s" },
        ],
        edges: [

  <div class="col" style="gap:22px">
    <div class="row3">
      <div class="card tint stat r" data-s="0"><div class="num">80%</div><div class="lab">of all hours streamed on Netflix come from recommendations, not search</div><div class="src">Gomez-Uribe &amp; Hunt, ACM TMIS [1]</div></div>
      <div class="card tint stat r" data-s="1"><div class="num">$1B+ / yr</div><div class="lab">annual retention value attributed to personalized recommendations</div><div class="src">Netflix Research [1]</div></div>
      <div class="card tint stat r" data-s="2"><div class="num">~90 sec</div><div class="lab">typical time before a viewer abandons browsing if nothing clicks</div><div class="src">Consumer UX study [1]</div></div>
    </div>
    <div class="card r" data-s="3"><span class="tag">How Netflix Computes Edge Weights w(u, i) in Production</span>
      <p>Netflix does not treat every play as weight 1. An edge weight combines <b>completion ratio</b> (finishing a season vs. stopping at 5 minutes), <b>rewatches</b>, <b>explicit thumbs-up</b>, and <b>temporal decay</b> — feeding graph candidates into deep ranking models that render ~40 titles on screen in under 50 ms [1].</p>
    </div>
  </div>`,
        steps: [
          {
            note: "Why does Netflix invest so heavily in this system? In their ACM paper, Netflix leaders Carlos Gomez-Uribe and Neil Hunt reported that 80 percent of all hours streamed come from recommendations.",
          },
          {
            note: "They estimate the recommender saves over 1 billion dollars every year by keeping subscribers from cancelling.",
          },
          {
            note: "Their user studies showed a viewer gives the screen about 90 seconds before losing interest — so ranking the top 40 slots accurately is crucial.",
          },
          {
            note: "In production, Netflix weights each edge using completion percentage, rewatches, and time decay, using fast graph candidate retrieval to feed their final ranking models.",
          },
        ],
      });

      // SLIDE 19: Production Pipeline & Challenges
      S.push({
        name: "Architecture & challenges",
        kicker: "Part 4 · Production Engineering",
        title: "The 4-stage production pipeline & key challenges",
        body: `
  <div class="col" style="gap:20px;height:100%">
    <div class="row4" style="height:155px">
      <div class="pbox r" data-s="0"><div class="k">STAGE 1</div><h3>Collect</h3><p>Log clicks, watch time, purchases &amp; ratings.</p></div>
      <div class="pbox r" data-s="0"><div class="k">STAGE 2</div><h3>Build Graph</h3><p>Update weighted user–item &amp; attribute edges.</p></div>
      <div class="pbox r" data-s="0"><div class="k">STAGE 3</div><h3>Retrieve</h3><p>Run random walks / paths to shortlist ~500 items.</p></div>
      <div class="pbox r" data-s="0"><div class="k">STAGE 4</div><h3>Rank &amp; Serve</h3><p>Score shortlist and render top-<i>k</i> on screen.</p></div>
    </div>
    <div class="row3">
      <div class="card tint r" data-s="1"><span class="tag">Challenge 1 · Popularity Bias</span><p>High-degree hubs pull in most walks. <b>Fix:</b> degree normalization (Cosine / PageRank).</p></div>
      <div class="card tint r" data-s="2"><span class="tag">Challenge 2 · Filter Bubbles</span><p>Short paths trap users in narrow clusters. <b>Fix:</b> inject controlled exploration slots.</p></div>
      <div class="card tint r" data-s="3"><span class="tag">Challenge 3 · Privacy</span><p>Interaction graphs can expose user identity. <b>Fix:</b> anonymization &amp; access controls.</p></div>
    </div>
  </div>`,
        steps: [
          {
            note: "Stepping back from Netflix to any production recommender system, the architecture follows four stages: collect interaction signals, update the weighted graph, run graph retrieval to shortlist a few hundred candidates out of millions, and rank the top items for the screen.",
          },
          {
            note: "Engineers must also guard against three pitfalls: popularity bias, which we counter with degree normalization;",
          },
          {
            note: "filter bubbles, where short paths trap users in an echo chamber unless we inject exploration;",
          },
          {
            note: "and privacy risks, since a user's edge pattern is a unique fingerprint that must be protected.",
          },
        ],
      });

      // SLIDE 20: Summary & References
      S.push({
        name: "Summary & references",
        kicker: "Conclusion",
        title: "Key takeaways",
        body: `
  <div class="two" style="grid-template-columns:1fr 380px;align-items:start">
    <div class="col">
      <div class="steprow r" data-s="0"><div class="n">1</div><div>Any recommender system can be modelled as a <b>bipartite graph G = (U, I, E)</b> of users and items.</div></div>
      <div class="steprow r" data-s="0"><div class="n">2</div><div><b>Collaborative filtering</b> is finding <b>length-3 paths</b> (User → Item → Peer → Item), counted by <b>B·Bᵀ·B</b>.</div></div>
      <div class="steprow r" data-s="0"><div class="n">3</div><div><b>Random walks (Personalized PageRank)</b> approximate degree-normalized path scores at million-node scale.</div></div>
      <div class="steprow r" data-s="0"><div class="n">4</div><div>Adding <b>attribute vertices</b> fuses content-based filtering into the same graph to solve cold start.</div></div>
      <div class="small r" data-s="1" style="margin-top:14px;font-size:13.5px;line-height:1.6">
        [1] C. A. Gomez-Uribe, N. Hunt. <i>The Netflix Recommender System: Algorithms, Business Value, and Innovation.</i> ACM TMIS, 2015.<br>
        [2] C. Eksombatchai et al. <i>Pixie: A System for Recommending 3+ Billion Items to 200+ Million Users in Real-Time.</i> WWW, 2018.<br>
        [3] L. Page, S. Brin, R. Motwani, T. Winograd. <i>The PageRank Citation Ranking: Bringing Order to the Web.</i> Stanford, 1999.</div>
    </div>
    <div class="card tint r" data-s="1" style="text-align:center;padding:48px 24px">
      <div style="font:600 40px var(--serif);color:var(--navy)">Thank you</div>
      <div style="font-size:21px;color:var(--muted);margin-top:10px">Questions?</div>
    </div>
  </div>`,
        steps: [
          {
            note: "To conclude: first, any recommender system can be modelled as a user-item bipartite graph. Second, collaborative filtering is simply counting length-3 paths. Third, random walks with restart let us compute those scores at massive scale. And fourth, adding attribute vertices unifies content-based filtering to solve cold start.",
          },
          { note: "Thank you everyone. I'd be happy to take your questions." },
        ],
      });

      // ============================================================ player
      const $ = (id) => document.getElementById(id);
      const stage = $("stage");
      const FLAT = [];
      S.forEach((s, si) => s.steps.forEach((_, k) => FLAT.push([si, k])));
      const start = S.map((_, si) => FLAT.findIndex((f) => f[0] === si));
      let pos = -1,
        rendered = -1,
        el = null;

      function render(si) {
        GEN++;
        const s = S[si];
        stage.innerHTML = `<div class="slide${s.cover ? " cover" : ""}">${s.cover ? "" : `<div class="head"><div class="kicker">${s.kicker}</div><h2 class="title">${s.title}</h2><div class="rule"></div></div>`}
    <div class="body">${s.body}</div><div class="sfoot"><span>Recommender Systems · A Graph Theory Approach</span><span>${si + 1} / ${S.length}</span></div></div>`;
        el = stage.firstElementChild;
        rendered = si;
      }
      function reveal(k) {
        el.querySelectorAll("[data-s]").forEach((x) =>
          x.classList.toggle("on", +x.dataset.s <= k),
        );
      }
      function go(p, still) {
        p = Math.max(0, Math.min(FLAT.length - 1, p));
        const [si, k] = FLAT[p];
        if (!(si === rendered && p === pos + 1)) {
          stage.classList.add("instant");
          render(si);
          reveal(k - 1);
          for (let j = 0; j < k; j++) {
            const f = S[si].steps[j].run;
            f && f(el, true);
          }
          void stage.offsetWidth;
          if (!still) stage.classList.remove("instant");
        }
        reveal(k);
        const f = S[si].steps[k].run;
        f && f(el, !!still);
        pos = p;
        $("count").textContent = `${si + 1} / ${S.length}`;
        $("notes").innerHTML =
          `<small>Speaker notes · ${si + 1}.${k + 1}</small>${S[si].steps[k].note}`;
        segs.forEach(
          (g, j) =>
            (g.firstChild.style.width =
              j < si
                ? "100%"
                : j > si
                  ? "0%"
                  : ((k + 1) / S[si].steps.length) * 100 + "%"),
        );
        [...$("menu").children].forEach((b, j) =>
          b.classList.toggle("cur", j === si),
        );
      }
      const segs = S.map((s, si) => {
        const g = document.createElement("div");
        g.className = "seg";
        g.innerHTML = "<i></i>";
        g.style.setProperty("--n", s.steps.length);
        g.title = `${si + 1}. ${s.name}`;
        g.onclick = (e) => {
          e.stopPropagation();
          go(start[si]);
        };
        $("prog").appendChild(g);
        return g;
      });
      S.forEach((s, si) => {
        const b = document.createElement("button");
        b.innerHTML = `<span>${String(si + 1).padStart(2, "0")}</span>${s.name}`;
        b.onclick = () => {
          go(start[si]);
          $("menu").hidden = true;
        };
        $("menu").appendChild(b);
      });

      const next = () => go(pos + 1),
        prev = () => go(pos - 1);
      function toggleFull() {
        document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen?.();
      }
      document.addEventListener("fullscreenchange", () => {
        document.body.classList.toggle("fs", !!document.fullscreenElement);
        $("bFull").classList.toggle("on", !!document.fullscreenElement);
        fit();
      });
      $("bPrev").onclick = prev;
      $("bNext").onclick = next;
      $("bFull").onclick = toggleFull;
      $("bMenu").onclick = () => {
        $("menu").hidden = !$("menu").hidden;
        $("help").hidden = true;
      };
      $("bHelp").onclick = () => {
        $("help").hidden = !$("help").hidden;
        $("menu").hidden = true;
      };
      $("bNotes").onclick = () => {
        $("notes").hidden = !$("notes").hidden;
        $("bNotes").classList.toggle("on", !$("notes").hidden);
      };
      $("viewport").onclick = () => {
        if (!$("menu").hidden || !$("help").hidden) {
          $("menu").hidden = $("help").hidden = true;
          return;
        }
        next();
      };
      document.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key;
        if ([" ", "ArrowRight", "ArrowDown", "PageDown", "Enter"].includes(k)) {
          e.preventDefault();
          next();
        } else if (
          ["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)
        ) {
          e.preventDefault();
          prev();
        } else if (k === "Home") go(0);
        else if (k === "End") go(FLAT.length - 1);
        else if (k === "f" || k === "F") toggleFull();
        else if (k === "n" || k === "N") $("bNotes").click();
        else if (k === "m" || k === "M") $("bMenu").click();
        else if (k === "?") $("bHelp").click();
        else if (k === "Escape") {
          $("menu").hidden = $("help").hidden = true;
        }
      });
      let tx = null;
      $("viewport").addEventListener(
        "touchstart",
        (e) => {
          tx = e.touches[0].clientX;
        },
        { passive: true },
      );
      $("viewport").addEventListener("touchend", (e) => {
        if (tx == null) return;
        const dx = e.changedTouches[0].clientX - tx;
        tx = null;
        if (Math.abs(dx) > 40) {
          e.preventDefault();
          dx < 0 ? next() : prev();
        }
      });

      function fit() {
        const v = $("viewport"),
          pad = document.body.classList.contains("fs") ? 0 : 24;
        const s = Math.min(
          (v.clientWidth - pad) / 1280,
          (v.clientHeight - pad) / 720,
        );
        stage.style.transform = `translate(-50%,-50%) scale(${Math.max(0.1, s)})`;
      }
      addEventListener("resize", fit);

      // ?bare = slide only (for screenshots) ; #slide.step deep link ; ?check = layout self-test
      if (location.search.includes("bare")) document.body.classList.add("fs");
      fit();
      const m = location.hash.match(/^#(\d+)(?:\.(\d+))?/);
      if (m) {
        const si = Math.min(S.length, +m[1]) - 1,
          k = Math.min(S[si].steps.length, +(m[2] || S[si].steps.length)) - 1;
        go(start[si] + k, location.search.includes("still"));
      } else go(0);

      if (location.search.includes("check")) {
        const out = [];
        S.forEach((s, si) => {
          go(start[si] + s.steps.length - 1, true);
          const b = el.querySelector(".body");
          if (
            b.scrollHeight > b.clientHeight + 1 ||
            b.scrollWidth > b.clientWidth + 1
          )
            out.push(
              `slide ${si + 1}: body overflow ${b.scrollWidth}x${b.scrollHeight} > ${b.clientWidth}x${b.clientHeight}`,
            );
          const br = b.getBoundingClientRect();
          const items = [
            ...el.querySelectorAll(
              ".card,.callout,.steprow,.def,.lead,.pbox,.small,.brow,.stat,.who,h1,.sub,table.mat",
            ),
          ].filter((x) => x.offsetParent);
          items.forEach((x) => {
            const r = x.getBoundingClientRect();
            if (r.bottom > br.bottom + 1 || r.right > br.right + 1)
              out.push(`slide ${si + 1}: clipped ${x.className}`);
          });
          for (let i = 0; i < items.length; i++)
            for (let j = i + 1; j < items.length; j++) {
              const a = items[i],
                c = items[j];
              if (a.contains(c) || c.contains(a)) continue;
              const A = a.getBoundingClientRect(),
                C = c.getBoundingClientRect();
              const ox = Math.min(A.right, C.right) - Math.max(A.left, C.left),
                oy = Math.min(A.bottom, C.bottom) - Math.max(A.top, C.top);
              if (ox > 2 && oy > 2)
                out.push(
                  `slide ${si + 1}: overlap "${a.className}" / "${c.className}"`,
                );
            }
        });
        const pre = document.createElement("pre");
        pre.id = "check";
        pre.textContent = out.length
          ? out.join("\n")
          : "LAYOUT OK (" + S.length + " slides)";
        document.body.appendChild(pre);
      }
    </script>
  </body>
</html>
